apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: o2-support
  labels:
    app: o2-web
spec:
  selector:
    app: o2-web
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: o2-web
  namespace: o2-support
spec:
  replicas: 1
  selector:
    matchLabels:
      app: o2-web
  template:
    metadata:
      labels:
        app: o2-web
    spec:
      containers:
        - name: web
          image: docker.io/library/o2-support-web:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: "25m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
