apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: o2-support
  labels:
    app: o2-api
spec:
  selector:
    app: o2-api
  ports:
    - name: http
      port: 4000
      targetPort: 4000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: o2-api
  namespace: o2-support
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: o2-api
  template:
    metadata:
      labels:
        app: o2-api
    spec:
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z db 5432; do echo waiting for db; sleep 2; done"]
      containers:
        - name: api
          image: docker.io/library/o2-support-api:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
          envFrom:
            - configMapRef:
                name: o2-support-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: o2-support-secret
                  key: DATABASE_URL
          readinessProbe:
            httpGet:
              path: /ready
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests:
              cpu: "100m"
              memory: "192Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
